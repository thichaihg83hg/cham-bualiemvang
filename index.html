<style>
:root{
  --do:#C8102E; --do-dam:#9B0C22; --do-nhat:#FDECEE;
  --vang:#F5A623; --vang-nhat:#FFF6E0; --nen:#FFFCF5;
  --chu:#0D1B2A; --chu-phu:#55606E; --vien:#E7DDC6; --vien-dam:#CDBF9F;
  --xanh:#1E7A4C; --xanh-nhat:#E6F4EC; --cam:#B86A00; --cam-nhat:#FFF1D6;
  --sans:"Be Vietnam Pro", "Segoe UI", Arial, sans-serif;
  --serif:"Noto Serif", "Times New Roman", Georgia, serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--nen);color:var(--chu);font:15px/1.55 var(--sans);-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--do-dam)}
:focus-visible{outline:3px solid var(--vang);outline-offset:2px}
.an{display:none!important}

/* ---------- Thanh trên cùng ---------- */
.topbar{background:var(--do);color:#fff;border-bottom:4px solid var(--vang);position:sticky;top:0;z-index:20}
.topbar-in{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:10px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{display:inline-grid;place-items:center;width:var(--c);height:var(--c);flex:none}
.logo img{width:100%;height:auto;display:block}
.logo.co-nen{background:var(--do);border-radius:50%;padding:calc(var(--c) * .2)}
.brand b{font-family:var(--serif);font-size:18px;letter-spacing:.2px;white-space:nowrap}
.brand small{display:block;font-size:12px;opacity:.85;white-space:nowrap}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{color:#fff;text-decoration:none;padding:7px 12px;border-radius:4px;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.12)}
.nav a.on{background:rgba(0,0,0,.18);box-shadow:inset 0 -3px 0 var(--vang)}
.user{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:14px}
.user button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:4px;padding:5px 10px;cursor:pointer}
.user button:hover{background:rgba(255,255,255,.12)}

main{max-width:1400px;margin:0 auto;padding:20px 18px 60px}
h1{font-family:var(--serif);font-size:24px;margin:0 0 4px;line-height:1.3}
.lead{color:var(--chu-phu);margin:0 0 18px}

/* ---------- Nút, ô nhập ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--vien-dam);background:#fff;padding:8px 14px;border-radius:5px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--chu);white-space:nowrap}
.btn:hover{border-color:var(--chu)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.chinh{background:var(--do);border-color:var(--do);color:#fff}
.btn.chinh:hover{background:var(--do-dam)}
.btn.vang{background:var(--vang);border-color:var(--vang);color:var(--chu)}
.btn.nho{padding:4px 9px;font-size:13px}
.btn.nguy{color:var(--do);border-color:#E9B3BC}
label.f{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
.o{width:100%;border:1px solid var(--vien-dam);border-radius:5px;padding:9px 11px;background:#fff}
.o:focus{border-color:var(--chu);outline:none;box-shadow:0 0 0 3px rgba(245,166,35,.35)}
textarea.o{min-height:64px;resize:vertical}
.hang{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.gian{flex:1}

/* ---------- Đăng nhập ---------- */
.dn-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:
  linear-gradient(180deg,var(--do) 0 220px, var(--nen) 220px)}
.dn{width:100%;max-width:400px;background:#fff;border:1px solid var(--vien);border-top:5px solid var(--vang);border-radius:6px;padding:28px 26px;box-shadow:0 18px 40px -24px rgba(13,27,42,.45)}
.dn .sao{display:flex;justify-content:center;margin:0 0 12px}
.dn h1{text-align:center;font-size:22px}
.dn p.lead{text-align:center;font-size:14px}
.dn .btn{width:100%;justify-content:center;margin-top:18px;padding:11px}
.loi{color:var(--do);font-size:14px;min-height:20px;margin-top:8px}

/* ---------- Tab loại hình, tiến độ ---------- */
.tabs{display:inline-flex;border:1px solid var(--vien-dam);border-radius:6px;overflow:hidden;background:#fff}
.tabs a,.tabs button{padding:8px 16px;text-decoration:none;color:var(--chu);border:0;background:transparent;cursor:pointer;font-weight:500}
.tabs a+a,.tabs button+button{border-left:1px solid var(--vien-dam)}
.tabs .on{background:var(--chu);color:#fff}
.tien-do{display:flex;align-items:center;gap:12px;margin:14px 0 6px;font-size:14px;color:var(--chu-phu)}
.thanh{flex:1;max-width:340px;height:8px;background:#EFE6D1;border-radius:4px;overflow:hidden}
.thanh i{display:block;height:100%;background:var(--xanh)}

/* ---------- Danh sách tác phẩm của giám khảo ---------- */
.ds{background:#fff;border:1px solid var(--vien);border-radius:6px;margin-top:12px}
.ds a.dong{display:grid;grid-template-columns:44px 1fr auto auto;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--vien);text-decoration:none;color:inherit}
.ds a.dong:first-child{border-top:0}
.ds a.dong:hover{background:var(--vang-nhat)}
.stt{font-family:var(--serif);font-weight:700;font-size:18px;color:var(--do);text-align:center}
.ten-tp{font-weight:600;line-height:1.4}
.phu{font-size:13px;color:var(--chu-phu)}
.diem-nho{font-family:var(--serif);font-weight:700;font-size:17px;min-width:48px;text-align:right}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap}
.chip.chua{background:#F1EEE6;color:var(--chu-phu)}
.chip.nhap{background:var(--cam-nhat);color:var(--cam)}
.chip.nop{background:var(--xanh-nhat);color:var(--xanh)}
.chip.do{background:var(--do-nhat);color:var(--do)}
.chip.cho{background:var(--cam-nhat);color:var(--cam);border:1px solid #F0C98A}
.diem-cho{color:var(--cam);font-weight:600}
.nhac-nop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0 2px;padding:12px 14px;border:1px solid #F0C98A;border-left:4px solid var(--vang);background:var(--cam-nhat);border-radius:6px}
.nhac-nop p{margin:0;flex:1;min-width:220px}
.trang-luu.du{color:var(--cam);font-weight:600}
.loc{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.loc button{border:1px solid var(--vien-dam);background:#fff;border-radius:20px;padding:4px 12px;cursor:pointer;font-size:13px}
.loc button.on{background:var(--chu);color:#fff;border-color:var(--chu)}

/* ---------- Màn hình chấm ---------- */
.cham{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(380px,1fr);gap:20px;align-items:start}
.xem{position:sticky;top:84px}
.khung-xem{background:#111;border-radius:6px;overflow:hidden;aspect-ratio:16/10}
.khung-xem iframe{width:100%;height:100%;border:0;display:block;background:#fff}
.nghe{background:#fff;border:1px solid var(--vien);border-top:4px solid var(--do);border-radius:6px;padding:18px 18px 14px}
.nghe-dau{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.nghe-dau .song{width:44px;height:44px;border-radius:50%;background:var(--do);display:grid;place-items:center;flex:none}
.nghe-dau b{display:block;font-size:16px}
.nghe audio{width:100%;height:54px;display:block}
.nghe-toc{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--chu-phu)}
.nghe-toc button{border:1px solid var(--vien-dam);background:#fff;border-radius:20px;padding:3px 11px;cursor:pointer;font-size:13px}
.nghe-toc button.on{background:var(--chu);color:#fff;border-color:var(--chu)}
.nghe-tt{font-size:13px;color:var(--chu-phu);margin:10px 0 0}
.nghe-tt.loi{color:var(--do)}
.khong-link{aspect-ratio:16/10;display:grid;place-items:center;text-align:center;background:var(--vang-nhat);border:1px dashed var(--vien-dam);border-radius:6px;padding:20px;color:var(--chu-phu)}
.tt-tp{margin-top:12px;background:#fff;border:1px solid var(--vien);border-radius:6px;padding:14px 16px}
.tt-tp h2{font-family:var(--serif);font-size:19px;margin:0 0 8px;line-height:1.35}
.tt-tp dl{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;margin:0;font-size:14px}
.tt-tp dt{color:var(--chu-phu)}
.tt-tp dd{margin:0;white-space:pre-line}

.phieu{background:#fff;border:1px solid var(--vien);border-radius:6px;box-shadow:0 1px 0 var(--vien)}
.phieu-dau{padding:16px 18px 10px;border-bottom:2px solid var(--do);text-align:center}
.phieu-dau b{font-family:var(--serif);font-size:20px;color:var(--do);letter-spacing:.5px;display:block}
.phieu-dau span{font-size:13px;color:var(--chu-phu)}
.nhom{border-bottom:1px solid var(--vien)}
.nhom-ten{display:flex;justify-content:space-between;align-items:baseline;padding:10px 18px 4px;font-weight:700}
.nhom-ten span{font-weight:500;font-size:13px;color:var(--chu-phu)}
.tc{display:grid;grid-template-columns:1fr 92px;gap:12px;align-items:center;padding:7px 18px}
.tc p{margin:0;font-size:14px;line-height:1.45}
.tc p small{display:block;color:var(--chu-phu);font-size:12px;margin-top:2px}
.tc select{width:92px;padding:7px 6px;border:1px solid var(--vien-dam);border-radius:5px;background:#fff;font-weight:700;text-align:center;font-size:16px}
.tc select.co{border-color:var(--xanh);background:var(--xanh-nhat)}
.nx{padding:4px 18px 14px}
.nx textarea{min-height:52px;font-size:14px}
.tru{background:var(--vang-nhat)}
.tong-box{display:flex;align-items:center;gap:14px;padding:14px 18px;flex-wrap:wrap}
.tong{display:flex;align-items:baseline;gap:6px;margin-right:auto}
.tong b{font-family:var(--serif);font-size:40px;line-height:1;color:var(--do);font-variant-numeric:tabular-nums}
.tong span{color:var(--chu-phu)}
.trang-luu{font-size:12px;color:var(--chu-phu);padding:0 18px 12px}
.da-nop{margin:12px 18px 0;padding:10px 12px;border-radius:5px;background:var(--xanh-nhat);color:var(--xanh);font-size:14px}
.dieu-huong{display:flex;justify-content:space-between;gap:10px;margin-top:14px}

/* ---------- Bảng tổng hợp ---------- */
.cong-cu{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.gk-tien-do{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.gk-tien-do span{background:#fff;border:1px solid var(--vien);border-radius:5px;padding:4px 10px;font-size:13px}
.gk-tien-do b{font-variant-numeric:tabular-nums}
.bang-wrap{overflow-x:auto;background:#fff;border:1px solid var(--vien);border-radius:6px}
table.bang{border-collapse:collapse;width:100%;font-size:14px;min-width:900px}
.bang th{background:var(--chu);color:#fff;font-weight:600;text-align:center;padding:9px 8px;font-size:13px;line-height:1.35;position:sticky;top:0}
.bang td{border-top:1px solid var(--vien);padding:8px;vertical-align:top}
.bang td.so{text-align:center;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.bang tr.lech td{background:var(--do-nhat)}
.bang tr:hover td{background:var(--vang-nhat)}
.bang tr.lech:hover td{background:#F9DCE0}
.bq{font-family:var(--serif);font-size:17px;color:var(--do)}
.bang select{border:1px solid var(--vien-dam);border-radius:4px;padding:4px;background:#fff;font-size:13px;max-width:150px}
.mo{color:var(--chu-phu);font-weight:400}
.chu-thich{font-size:13px;color:var(--chu-phu);margin-top:10px}

/* ---------- Bảng quản trị ---------- */
.link-ok{color:var(--xanh);font-weight:600}
.link-thieu{color:var(--do);font-weight:600}

/* ---------- Hộp thoại ---------- */
.nen-mo{position:fixed;inset:0;background:rgba(13,27,42,.55);display:grid;place-items:center;padding:16px;z-index:50}
.hop{background:#fff;border-radius:7px;width:100%;max-width:560px;max-height:calc(100vh - 32px);overflow:auto;border-top:5px solid var(--vang)}
.hop.rong{max-width:1000px}
.hop-dau{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--vien);position:sticky;top:0;background:#fff;z-index:1}
.hop-dau h3{margin:0;font-family:var(--serif);font-size:18px}
.hop-dau button{border:0;background:transparent;font-size:24px;line-height:1;cursor:pointer;padding:0 4px}
.hop-than{padding:6px 20px 18px}
.hop-chan{display:flex;justify-content:flex-end;gap:10px;padding:12px 20px;border-top:1px solid var(--vien);position:sticky;bottom:0;background:#fff}
.chk{display:inline-flex;align-items:center;gap:6px;margin-right:16px;font-weight:500}
table.ct{border-collapse:collapse;width:100%;font-size:13px;margin-top:10px}
.ct th,.ct td{border:1px solid var(--vien);padding:6px 7px;vertical-align:top}
.ct th{background:var(--vang-nhat);font-weight:600}
.ct td.so{text-align:center;font-weight:600;white-space:nowrap}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{background:var(--chu);color:#fff;padding:10px 16px;border-radius:6px;font-size:14px;box-shadow:0 8px 20px rgba(0,0,0,.25);max-width:90vw}
#toast div.loi{background:var(--do);color:#fff;margin:0;min-height:0}
.dang-tai{padding:40px;text-align:center;color:var(--chu-phu)}

@media (max-width:980px){
  .cham{grid-template-columns:1fr}
  .xem{position:static}
  .tong-box{position:sticky;bottom:0;background:#fff;border-top:2px solid var(--vang);box-shadow:0 -8px 18px -12px rgba(13,27,42,.4);z-index:5;border-radius:0 0 6px 6px}
  .tong b{font-size:32px}
}

/* Chuyển link Google Drive / YouTube sang dạng xem nhúng */
function linkXem(link) {
  if (!link) return { nhung: null, mo: null };
  const l = link.trim();
  let m = l.match(/drive\.google\.com\/file\/d\/([\w-]+)/) || l.match(/drive\.google\.com\/(?:open|uc)\?(?:.*&)?id=([\w-]+)/);
  if (m) return { nhung: `https://drive.google.com/file/d/${m[1]}/preview`, mo: `https://drive.google.com/file/d/${m[1]}/view`, id: m[1] };
  m = l.match(/drive\.google\.com\/drive\/(?:u\/\d+\/)?folders\/([\w-]+)/);
  if (m) return { nhung: `https://drive.google.com/embeddedfolderview?id=${m[1]}#list`, mo: l, thuMuc: true };

  } catch (e) {
    throw new Error('Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.');

  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }

  return data;
}

const SAO = (c = 30, nen = false) => `<span class="logo${nen ? ' co-nen' : ''}" style="--c:${c}px"><img src="${LOGO_PNG}" alt="Biểu tượng búa liềm"></span>`;

function khung(noiDung, tab) {
  const nav = [];
  if (laGiamKhao()) nav.push(['#/cham', 'Chấm điểm', 'cham']);
  if (laAdmin() || laToTruong()) nav.push([`#/tonghop/${loaiHinhCuaToi()[0] || 'PT'}`, 'Tổng hợp', 'tonghop']);
  if (laAdmin()) { nav.push(['#/tacpham/PT', 'Tác phẩm', 'tacpham']); nav.push(['#/taikhoan', 'Tài khoản', 'taikhoan']); }
  const vt = { admin: 'Thư ký', totruong: 'Tổ trưởng', giamkhao: 'Giám khảo' }[S.phien.vai_tro];
  $('#app').innerHTML = `
  <header class="topbar"><div class="topbar-in">
    <div class="brand">${SAO(36)}<div><b>Giải Búa liềm vàng 2026</b><small>Đảng bộ tỉnh Tuyên Quang lần thứ I</small></div></div>
    <nav class="nav">${nav.map(n => `<a href="${n[0]}" class="${n[2] === tab ? 'on' : ''}">${n[1]}</a>`).join('')}</nav>
    <div class="user"><span>${esc(S.phien.ho_ten)} · ${vt}</span>
      <button data-act="doi-mk">Đổi mật khẩu</button><button data-act="dang-xuat">Đăng xuất</button></div>
  </div></header>
  <main id="main">${noiDung || '<div class="dang-tai">Đang tải…</div>'}</main>`;
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  if (b.dataset.act === 'dang-xuat') { api('dang_xuat').catch(() => {}); luuPhien(null); di('#/'); }
  if (b.dataset.act === 'doi-mk') moDoiMatKhau();
  if (b.dataset.act === 'dong-hop') dongHop();
});

/* ---------- Hộp thoại ---------- */
function moHop(tieuDe, than, chan = '', rong = false) {
  $('#modal-root').innerHTML = `<div class="nen-mo"><div class="hop ${rong ? 'rong' : ''}" role="dialog" aria-modal="true" aria-label="${esc(tieuDe)}">
    <div class="hop-dau"><h3>${esc(tieuDe)}</h3><button data-act="dong-hop" aria-label="Đóng">×</button></div>
    <div class="hop-than">${than}</div>${chan ? `<div class="hop-chan">${chan}</div>` : ''}</div></div>`;
  const nen = $('.nen-mo');
  nen.addEventListener('mousedown', e => { if (e.target === nen) dongHop(); });
  const f = $('.hop-than input, .hop-than select, .hop-than textarea, .hop-chan .btn.chinh', nen);
  if (f) setTimeout(() => f.focus(), 30);
  return nen;
}
function dongHop() { $('#modal-root').innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('.nen-mo')) dongHop(); });

/* Hộp xác nhận thao tác xóa; nếu có `chuoi` thì phải gõ đúng mới bấm được */
function xacNhanXoa({ tieuDe, noiDung, chuoi, nut }, thucHien) {
  const h = moHop(tieuDe, `${noiDung}
    ${chuoi ? `<label class="f" for="xn-go">Gõ <b>${esc(chuoi)}</b> để xác nhận</label><input class="o" id="xn-go" autocomplete="off" autocapitalize="none">` : ''}
    <div class="loi" id="xn-loi"></div>`,
    `<button class="btn" data-act="dong-hop">Hủy</button><button class="btn chinh" id="xn-ok" ${chuoi ? 'disabled' : ''}>${esc(nut)}</button>`);
  const ok = $('#xn-ok', h);
  if (chuoi) $('#xn-go', h).oninput = e => { ok.disabled = e.target.value.trim().toLowerCase() !== chuoi.toLowerCase(); };
  ok.onclick = async () => {
    ok.disabled = true;
    try { await thucHien(); } catch (e) { $('#xn-loi', h).textContent = e.message; ok.disabled = false; }
  };
}

function moDoiMatKhau() {
  const h = moHop('Đổi mật khẩu', `
    <label class="f" for="mk1">Mật khẩu hiện tại</label><input class="o" id="mk1" type="password" autocomplete="current-password">
    <label class="f" for="mk2">Mật khẩu mới (ít nhất 6 ký tự)</label><input class="o" id="mk2" type="password" autocomplete="new-password">
    <label class="f" for="mk3">Nhập lại mật khẩu mới</label><input class="o" id="mk3" type="password" autocomplete="new-password">
    <div class="loi" id="mk-loi"></div>`,
    `<button class="btn" data-act="dong-hop">Hủy</button><button class="btn chinh" id="mk-luu">Đổi mật khẩu</button>`);
  $('#mk-luu', h).onclick = async () => {
    const [a, b, c] = ['#mk1', '#mk2', '#mk3'].map(s => $(s, h).value);
    if (b !== c) { $('#mk-loi', h).textContent = 'Hai lần nhập mật khẩu mới không khớp.'; return; }
    try { await api('doi_mat_khau', { p_mat_khau_cu: a, p_mat_khau_moi: b }); dongHop(); toast('Đã đổi mật khẩu.'); }
    catch (e) { $('#mk-loi', h).textContent = e.message; }
  };
}

/* =====================================================================
   ĐIỀU HƯỚNG
   ===================================================================== */
let roiTrang = null;   // hàm dọn dẹp khi rời màn hình (lưu nháp)
function di(h) { if (location.hash === h) dieuHuong(); else location.hash = h; }
async function dieuHuong() {
  if (roiTrang) { try { roiTrang(); } catch (e) {} roiTrang = null; }
  window.onbeforeunload = null;
  $$('audio').forEach(a => { try { a.pause(); } catch (e) {} });
  dongHop();
  if (!S.phien) return manDangNhap();
  const p = (location.hash || '#/').slice(2).split('/');
  const trang = p[0];
  try {
    if (trang === 'cham' && /^\d+$/.test(p[1] || '') && laGiamKhao()) return await manCham(+p[1]);
    if (trang === 'cham' && laGiamKhao()) return await manDanhSach(p[1]);
    if (trang === 'tonghop' && (laAdmin() || laToTruong())) return await manTongHop(p[1]);
    if (trang === 'tacpham' && laAdmin()) return await manTacPham(p[1] || 'PT');
    if (trang === 'taikhoan' && laAdmin()) return await manTaiKhoan();
  } catch (e) {
    if (e.ma === 'PHIEN_HET_HAN') return;
    khung(`<div class="dang-tai">${esc(e.message)}</div>`);
    return;
  }
  location.replace(laGiamKhao() ? '#/cham' : `#/tonghop/${loaiHinhCuaToi()[0] || 'PT'}`);
}
window.addEventListener('hashchange', dieuHuong);

/* =====================================================================
   MÀN HÌNH ĐĂNG NHẬP
   ===================================================================== */
function manDangNhap() {
  $('#app').innerHTML = `<div class="dn-wrap"><form class="dn" id="f-dn" autocomplete="on">
    <span class="sao">${SAO(76, true)}</span>
    <h1>Chấm giải Búa liềm vàng</h1>
    <p class="lead">Giải báo chí về xây dựng Đảng của Đảng bộ tỉnh Tuyên Quang lần thứ I – Năm 2026</p>
    <label class="f" for="dn-ten">Tên đăng nhập</label>
    <input class="o" id="dn-ten" autocomplete="username" autocapitalize="none" required>
    <label class="f" for="dn-mk">Mật khẩu</label>
    <input class="o" id="dn-mk" type="password" autocomplete="current-password" required>
    <button class="btn chinh" type="submit">Đăng nhập</button>
    <div class="loi" id="dn-loi"></div>
  </form></div>`;
  $('#dn-ten').focus();
  $('#f-dn').onsubmit = async e => {
    e.preventDefault();
    const btn = $('#f-dn button'); btn.disabled = true; $('#dn-loi').textContent = '';
    try {
      const p = await rpc('dang_nhap', { p_ten_dang_nhap: $('#dn-ten').value, p_mat_khau: $('#dn-mk').value });
      luuPhien(p);
      di('#/');
    } catch (err) { $('#dn-loi').textContent = err.message; btn.disabled = false; }
  };
}

/* =====================================================================
   GIÁM KHẢO: DANH SÁCH TÁC PHẨM
   ===================================================================== */
let locTrangThai = 'tat-ca';
async function manDanhSach(lhChon) {
  khung(null, 'cham');
  const ds = await api('ds_tac_pham_cua_toi');
  S.dsCuaToi = ds;
  const cacLH = loaiHinhCuaToi();
  const lh = cacLH.includes(lhChon) ? lhChon : (S.lhDangXem && cacLH.includes(S.lhDangXem) ? S.lhDangXem : cacLH[0]);
  S.lhDangXem = lh;
  if (!lh) { $('#main').innerHTML = '<div class="dang-tai">Tài khoản chưa được phân công loại hình nào. Liên hệ Thư ký.</div>'; return; }
  const cua = ds.filter(t => t.loai_hinh === lh);
  const daNop = cua.filter(t => t.trang_thai === 'da_nop').length;
  const choNop = cua.filter(t => t.trang_thai === 'nhap' && t.du);
  const loc = {
    'tat-ca': () => true, 'chua': t => !t.trang_thai, 'nhap': t => t.trang_thai === 'nhap' && !t.du,
    'cho': t => t.trang_thai === 'nhap' && t.du, 'nop': t => t.trang_thai === 'da_nop',
  };
  const hien = cua.filter(loc[locTrangThai] || loc['tat-ca']);
  $('#main').innerHTML = `
    <h1>Tác phẩm cần chấm</h1>

/* =====================================================================
   GIÁM KHẢO: MÀN HÌNH CHẤM
   ===================================================================== */
function luaChonDiem(max, gt) {
  let h = '<option value="">—</option>';
  for (let v = 0; v <= max + 1e-9; v += 0.25) {
    const x = Math.round(v * 100) / 100;
    h += `<option value="${x}" ${gt != null && Math.abs(gt - x) < 1e-9 ? 'selected' : ''}>${fmt(x)}</option>`;
  }
  return h;
}

/* Trình phát âm thanh cho tác phẩm phát thanh (phát thẳng file MP3 trên Drive) */
function khungNghe(lx, tp) {
  return `<div class="nghe">
    <div class="nghe-dau"><span class="song"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zm-7 9a7 7 0 0 0 6 6.9V21h2v-2.1A7 7 0 0 0 19 12h-2a5 5 0 0 1-10 0H5z" fill="#F5A623"/></svg></span>
      <div><b>Nghe tác phẩm</b><span class="phu">${tp.thoi_luong ? esc(tp.thoi_luong) : 'Bấm nút phát để nghe'}</span></div></div>
    <audio id="am-thanh" controls preload="metadata" src="https://drive.google.com/uc?export=download&id=${encodeURIComponent(lx.id)}"></audio>
    <div class="nghe-toc">Tốc độ nghe: ${[1, 1.25, 1.5].map(v => `<button type="button" data-toc="${v}" class="${v === 1 ? 'on' : ''}">${fmt(v)}×</button>`).join('')}
      <span class="gian"></span><button type="button" id="dung-drive">Dùng trình phát Google Drive</button></div>
    <p class="nghe-tt" id="nghe-tt">Đang tải âm thanh…</p>
  </div>`;
}
function ganKhungNghe(lx, tp) {
  const au = $('#am-thanh'); if (!au) return;
  const tt = $('#nghe-tt');
  const phut = s => `${Math.floor(s / 60)} phút ${String(Math.round(s % 60)).padStart(2, '0')} giây`;
  const sangDrive = (loi) => {
    au.pause();
    $('#khung-tp').innerHTML = `<div class="khung-xem"><iframe src="${esc(lx.nhung)}" allow="autoplay; fullscreen" allowfullscreen title="Tác phẩm ${esc(tp.ten)}"></iframe></div>
      ${loi ? '<p class="nghe-tt loi">File này không phát trực tiếp được nên đã chuyển sang trình phát của Google Drive. Nếu vẫn không nghe được, bấm "Mở tác phẩm ở tab mới".</p>' : ''}`;
  };
  au.addEventListener('loadedmetadata', () => { tt.className = 'nghe-tt'; tt.textContent = isFinite(au.duration) ? `Sẵn sàng. Thời lượng ${phut(au.duration)}.` : 'Sẵn sàng.'; });
  au.addEventListener('waiting', () => { tt.textContent = 'Đang tải thêm…'; });
  au.addEventListener('playing', () => { tt.textContent = isFinite(au.duration) ? `Đang phát · thời lượng ${phut(au.duration)}` : 'Đang phát'; });
  au.addEventListener('error', () => sangDrive(true));
  $$('[data-toc]').forEach(b => b.onclick = () => {
    au.playbackRate = +b.dataset.toc;
    $$('[data-toc]').forEach(x => x.classList.toggle('on', x === b));
  });
  $('#dung-drive').onclick = () => sangDrive(false);
}

/* =====================================================================
   TỔNG HỢP ĐIỂM (Thư ký, Tổ trưởng)
   ===================================================================== */
let sapXepTheoDiem = false;
function tinhKetQua(data) {
  const gks = data.giam_khao;
  const idGK = new Set(gks.map(g => g.id));
  return data.tac_pham.map(tp => {
    const theoGK = {};
    tp.phieu.forEach(p => { if (idGK.has(p.giam_khao_id)) theoGK[p.giam_khao_id] = p; });
    const nop = Object.values(theoGK).filter(p => p.trang_thai === 'da_nop');
    const tongs = nop.map(p => Number(p.tong));
    const tb = (f) => nop.length ? nop.reduce((a, p) => a + f(p), 0) / nop.length : null;
    const bq = nop.length ? lam2(tb(p => Number(p.tong))) : null;
    const lech = nop.length >= 2 ? lam2(Math.max(...tongs) - Math.min(...tongs)) : null;
    return {
      tp, theoGK, soNop: nop.length, bq, lech, coLech: lech != null && lech >= 2,
      tdxh: tb(p => Number(p.diem[6]) + Number(p.diem[7])),
      ht: tb(p => Number(p.diem[3]) + Number(p.diem[4]) + Number(p.diem[5])),
      du: nop.length === gks.length && gks.length > 0,
      khung: khungGiai(bq),
    };
  });
}
function sapXep(kq) {
  const a = [...kq];
  if (sapXepTheoDiem) a.sort((x, y) => (y.bq ?? -1) - (x.bq ?? -1) || (y.tdxh ?? -1) - (x.tdxh ?? -1) || (y.ht ?? -1) - (x.ht ?? -1) || x.tp.stt - y.tp.stt);
  return a;
}

async function manTongHop(lhChon) {
  khung(null, 'tonghop');

  const data = await api('tong_hop', { p_loai_hinh: lh });
  S.tongHop = { lh, data };
  veTongHop();
}

  const { lh, data } = S.tongHop;
  const gks = data.giam_khao;
  const kq = tinhKetQua(data);
  const ds = sapXep(kq);

  const cacLH = loaiHinhCuaToi();
  $('#main').innerHTML = `
    <h1>Tổng hợp điểm – ${LOAI_HINH[lh].day}</h1>
    <p class="lead">${data.tac_pham.length} tác phẩm, ${gks.length} giám khảo. Đã đủ phiếu: ${soDu}/${data.tac_pham.length} tác phẩm.${soLech ? ` <b style="color:var(--do)">${soLech} tác phẩm chênh lệch từ 2 điểm trở lên.</b>` : ''}</p>

    <div class="gk-tien-do">${gks.map((g, i) => {

/* ---------- Xuất Excel theo mẫu biểu tổng hợp ---------- */
function napExcelJS() {
  if (window.ExcelJS) return Promise.resolve();
  const nguon = ['https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js'];
  return nguon.reduce((p, url) => p.catch(() => new Promise((ok, loi) => {
    const s = document.createElement('script'); s.src = url; s.onload = ok; s.onerror = loi; document.head.appendChild(s);
  })), Promise.reject()).catch(() => { throw new Error('Không tải được thư viện Excel. Kiểm tra mạng rồi thử lại.'); });
}

async function xuatExcel(lh, data, ds) {
  toast('Đang tạo file Excel…');
  await napExcelJS();
  const gks = data.giam_khao;
  const wb = new ExcelJS.Workbook();
  const F = { name: 'Times New Roman', size: 12 };
  const vien = { top: { style: 'thin' }, left: { style: 'thin' }, bottom: { style: 'thin' }, right: { style: 'thin' } };
  const giua = { horizontal: 'center', vertical: 'middle', wrapText: true };

  /* --- Sheet 1: Biểu tổng hợp --- */
  const ws = wb.addWorksheet('Tổng hợp', { pageSetup: { paperSize: 9, orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0,
    margins: { left: 0.6, right: 0.4, top: 0.6, bottom: 0.6, header: 0.3, footer: 0.3 } } });
  const cot = [6, 34, 24, 26, 12, ...gks.map(() => 11), 11, 15, 26];
  const n = cot.length;
  ws.columns = cot.map(w => ({ width: w }));
  const dat = (r, c1, c2, v, f = {}, a = giua) => {
    if (c2 > c1) ws.mergeCells(r, c1, r, c2);
    const c = ws.getCell(r, c1); c.value = v; c.font = { ...F, ...f }; c.alignment = a;
  };
  const giuaPhai = Math.max(6, n - 3);
  dat(1, 1, 4, `BAN TỔ CHỨC GIẢI BÁO CHÍ VỀ XÂY DỰNG ĐẢNG\nBAN GIÁM KHẢO ${LOAI_HINH[lh].to}\n*`, { bold: true });
  dat(1, giuaPhai, n, 'ĐẢNG CỘNG SẢN VIỆT NAM', { bold: true, size: 13 });
  ws.getRow(1).height = 52;
  const nay = new Date();
  dat(2, giuaPhai, n, `Tuyên Quang, ngày ${String(nay.getDate()).padStart(2, '0')} tháng ${String(nay.getMonth() + 1).padStart(2, '0')} năm ${nay.getFullYear()}`, { italic: true });
  dat(4, 1, n, 'BẢNG TỔNG HỢP KẾT QUẢ CHẤM ĐIỂM', { bold: true, size: 14 });
  dat(5, 1, n, 'Tác giả, tác phẩm tham gia Giải báo chí của Đảng bộ tỉnh về xây dựng Đảng năm 2026', { bold: true });
  dat(6, 1, n, `(Loại hình ${LOAI_HINH[lh].day})`, { italic: true });

  const tieuDe = ['STT', 'Tên tác phẩm', 'Tên tác giả', 'Đơn vị công tác/số điện thoại', 'Thời lượng/\ndung lượng',
    ...gks.map((g, i) => `GK${i + 1}\n${g.ho_ten}`), 'Điểm bình quân', 'Dự kiến giải', 'Ghi chú'];
  const r0 = 8;
  tieuDe.forEach((t, i) => { const c = ws.getCell(r0, i + 1); c.value = t; c.font = { ...F, bold: true }; c.alignment = giua; c.border = vien;
    c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFF6E0' } }; });
  ws.getRow(r0).height = 48;

  ds.forEach((r, k) => {
    const row = r0 + 1 + k;
    const p = gks.map(g => { const x = r.theoGK[g.id]; return x && x.trang_thai === 'da_nop' ? Number(x.tong) : null; });
    const gt = [r.tp.stt, r.tp.ten, r.tp.tac_gia, r.tp.don_vi, r.tp.thoi_luong, ...p, r.bq,
      r.tp.du_kien_giai || (r.du ? r.khung : ''), r.tp.ghi_chu];
    gt.forEach((v, i) => {
      const c = ws.getCell(row, i + 1);
      c.value = v ?? ''; c.font = F; c.border = vien;
      c.alignment = (i === 0 || i >= 4 && i < n - 1) ? giua : { vertical: 'middle', wrapText: true };
      if (i >= 5 && i < 5 + gks.length + 1 && typeof v === 'number') c.numFmt = '0.00';
      if (i === 5 + gks.length) c.font = { ...F, bold: true };
      if (r.coLech && i >= 5 && i <= 5 + gks.length) c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFADADF' } };
    });
  });
  let rc = r0 + ds.length + 2;
  if (ds.some(r => r.coLech)) { dat(rc, 1, n, 'Ghi chú: Ô tô đỏ là tác phẩm có điểm giữa các giám khảo chênh lệch từ 02 điểm trở lên (khoản 1 Điều 6 Quy chế).', { italic: true, size: 11 }, { horizontal: 'left', wrapText: true }); rc += 2; }
  dat(rc, 1, 3, 'THƯ KÝ TỔNG HỢP', { bold: true });
  dat(rc, giuaPhai, n, 'TỔ TRƯỞNG TỔ GIÁM KHẢO', { bold: true });
  ws.views = [{ state: 'frozen', ySplit: r0 }];

  /* --- Sheet 2: Chi tiết từng phiếu --- */
  const w2 = wb.addWorksheet('Chi tiết phiếu chấm', { pageSetup: { paperSize: 9, orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0 } });
  const td2 = ['STT', 'Tên tác phẩm', 'Giám khảo', ...TIEU_CHI.map((t, i) => `TC${i + 1}\n(tối đa ${fmt(t.max)})`), 'Điểm trừ', 'Tổng điểm', 'Trạng thái', 'Nhận xét'];
  w2.columns = [6, 34, 20, ...TIEU_CHI.map(() => 9), 9, 10, 11, 50].map(w => ({ width: w }));
  td2.forEach((t, i) => { const c = w2.getCell(1, i + 1); c.value = t; c.font = { ...F, bold: true }; c.alignment = giua; c.border = vien;
    c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFF6E0' } }; });
  w2.getRow(1).height = 44;
  let r2 = 2;
  data.tac_pham.forEach(tp => gks.forEach(g => {
    const p = tp.phieu.find(x => x.giam_khao_id === g.id);
    if (!p) return;
    const nx = [['Nội dung', p.nx_noi_dung], ['Hình thức', p.nx_hinh_thuc], ['Tác động XH', p.nx_tac_dong], ['Chung', p.nx_chung]].filter(x => x[1]).map(x => `${x[0]}: ${x[1]}`).join('\n');
    [tp.stt, tp.ten, g.ho_ten, ...p.diem.map(so), Number(p.diem_tru), Number(p.tong), p.trang_thai === 'da_nop' ? 'Đã nộp' : du8(p) ? 'Chưa nộp' : 'Đang chấm', nx]
      .forEach((v, i) => { const c = w2.getCell(r2, i + 1); c.value = v ?? ''; c.font = F; c.border = vien;
        c.alignment = (i === 1 || i === 2 || i === td2.length - 1) ? { vertical: 'top', wrapText: true } : { ...giua, vertical: 'top' }; });
    r2++;
  }));
  w2.views = [{ state: 'frozen', ySplit: 1 }];

  const buf = await wb.xlsx.writeBuffer();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  const d = new Date();
  a.download = `TongHop_BuaLiemVang_${lh === 'PT' ? 'PhatThanh' : 'TruyenHinh'}_${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.xlsx`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* Đọc file Excel danh sách theo mẫu (dòng tiêu đề có "STT", "Tên tác phẩm"...) */
async function docExcelDanhSach(buf) {
  const wb = new ExcelJS.Workbook();
  await wb.xlsx.load(buf);
  const ws = wb.worksheets[0];
  const chuan = s => String(s || '').toLowerCase().replace(/\s+/g, ' ').trim();
  const text = c => { const v = c.value; if (v == null) return ''; if (typeof v === 'object') { if (v.richText) return v.richText.map(x => x.text).join(''); if (v.text) return typeof v.text === 'string' ? v.text : (v.text.richText || []).map(x => x.text).join(''); if (v.result != null) return String(v.result); } return String(c.text ?? v); };
  const lienKet = c => { const v = c.value; return (v && typeof v === 'object' && v.hyperlink) ? v.hyperlink : (c.hyperlink || ''); };
  let hangTieuDe = 0, map = {};
  ws.eachRow((row, rn) => {
    if (hangTieuDe) return;
    const cells = {};
    row.eachCell((c, cn) => { cells[cn] = chuan(text(c)); });
    const cSTT = Object.keys(cells).find(k => cells[k] === 'stt');
    const cTen = Object.keys(cells).find(k => cells[k].includes('tên tác phẩm'));
    if (cSTT && cTen) {
      hangTieuDe = rn;
      const tim = f => { const k = Object.keys(cells).find(k => f(cells[k])); return k ? +k : 0; };
      map = { stt: +cSTT, ten: +cTen, tac_gia: tim(s => s.includes('tác giả')), don_vi: tim(s => s.includes('đơn vị')),
        thoi_luong: tim(s => s.includes('thời lượng')), the_loai: tim(s => s.includes('thể loại')), ghi_chu: tim(s => s.includes('ghi chú')),
        link: tim(s => s.includes('link') || s.includes('đường dẫn') || s.includes('liên kết')) };
    }
  });
  if (!hangTieuDe) throw new Error('Không tìm thấy dòng tiêu đề có cột "STT" và "Tên tác phẩm" trong sheet đầu tiên.');
  const ds = [];
  ws.eachRow((row, rn) => {
    if (rn <= hangTieuDe) return;
    const stt = parseInt(text(row.getCell(map.stt)), 10);
    if (!Number.isFinite(stt)) return;
    const lay = k => map[k] ? text(row.getCell(map[k])).trim() : '';
    const cTen = row.getCell(map.ten);
    let link = map.link ? (lienKet(row.getCell(map.link)) || lay('link')) : '';
    if (!link) link = lienKet(cTen);
    if (link && !/^https?:\/\//i.test(link)) link = '';
    ds.push({ stt, ten: text(cTen).trim(), tac_gia: lay('tac_gia').replace(/;\s*$/, ''), don_vi: lay('don_vi'), thoi_luong: lay('thoi_luong'),
      the_loai: lay('the_loai'), ghi_chu: lay('ghi_chu'), link });
  });
  return ds.filter(x => x.ten);
}

async function nhapExcel(file, lh) {
  try {
    await napExcelJS();
    const ds = await docExcelDanhSach(await file.arrayBuffer());
    if (!ds.length) throw new Error('Không đọc được tác phẩm nào trong file.');
    const h = moHop('Nhập danh sách từ Excel', `
      <p>Đọc được <b>${ds.length}</b> tác phẩm (${ds.filter(x => x.link).length} tác phẩm có link) từ file <b>${esc(file.name)}</b>.</p>
      <label class="f" for="nx-lh">Nhập vào loại hình</label>
      <select class="o" id="nx-lh">${Object.keys(LOAI_HINH).map(k => `<option value="${k}" ${k === lh ? 'selected' : ''}>${LOAI_HINH[k].ten}</option>`).join('')}</select>
      <p class="phu">Tác phẩm trùng số thứ tự sẽ được cập nhật thông tin; link và thể loại đang có được giữ nguyên nếu ô trong file để trống.</p>
      <div style="max-height:220px;overflow:auto;border:1px solid var(--vien);border-radius:5px;padding:6px 10px;font-size:13px">${ds.map(x => `<div>${x.stt}. ${esc(x.ten)} ${x.link ? '<span class="link-ok">· có link</span>' : ''}</div>`).join('')}</div>`,
      `<button class="btn" data-act="dong-hop">Hủy</button><button class="btn chinh" id="nx-ok">Nhập ${ds.length} tác phẩm</button>`);
    $('#nx-ok', h).onclick = async () => {
      const lhNhap = $('#nx-lh', h).value;
      try { const n = await api('nhap_tac_pham', { p_loai_hinh: lhNhap, p_ds: ds }); dongHop(); toast(`Đã nhập ${n} tác phẩm.`); di('#/tacpham/' + lhNhap); }
      catch (e) { toast(e.message, true); }
    };
  } catch (e) { toast(e.message, true); }
}
